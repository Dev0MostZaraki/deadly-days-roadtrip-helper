name: Build Windows Companion

on:
  push:
    branches: [ main ]
    paths:
      - 'companion/**'
      - 'index.html'
      - 'styles.css'
      - 'data.js'
      - 'engine.js'
      - 'ui.js'
      - '.github/workflows/companion-build.yml'
  pull_request:
    paths:
      - 'companion/**'
      - 'index.html'
      - 'styles.css'
      - 'data.js'
      - 'engine.js'
      - 'ui.js'
      - '.github/workflows/companion-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore .\companion\src\DeadlyDays.Companion\DeadlyDays.Companion.csproj
      - name: Build
        run: dotnet build .\companion\src\DeadlyDays.Companion\DeadlyDays.Companion.csproj -c Release --no-restore
      - name: Publish win-x64
        run: dotnet publish .\companion\src\DeadlyDays.Companion\DeadlyDays.Companion.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .\artifacts\DeadlyDaysCompanion
      - name: Upload companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadlyDaysCompanion-win-x64
          path: .\artifacts\DeadlyDaysCompanion
          if-no-files-found: error
